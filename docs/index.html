<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title data-i18n>法術整備輔助｜D&amp;D</title>
<style>:root {
 color-scheme:dark;
 --bg:#141916;--panel:#1d2420;--quiet:#202a24;--line:#344039;--ink:#f0eee4;--muted:#afbcb1;
 --gold:#e5ba77;--green:#b0cbb2;--danger:#ec9d93;
 font:15px/1.55 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
 background:var(--bg);color:var(--ink);
}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button,input,select,textarea{border:1px solid var(--line);background:#161c19;border-radius:7px}
button{cursor:pointer;white-space:nowrap;padding:7px 12px;background:#26322a}
button:hover:enabled{border-color:var(--gold);background:#344039}
button:disabled{cursor:default;opacity:.48}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);border-color:var(--gold);color:#231a10;font-weight:750}
button.primary:hover:enabled{background:#f2ce9a;color:#231a10}
button.danger{color:var(--danger)}
input:not([type=checkbox]),select,textarea{padding:8px 10px;min-width:0}
input[type=checkbox]{accent-color:var(--gold);width:17px;height:17px;margin:3px 6px 0 0;flex-shrink:0}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.top{padding:18px clamp(16px,3vw,45px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #3f4738;background:#19221c}
.identity,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.identity{gap:15px}
.emblem{display:grid;place-items:center;width:45px;height:45px;background:#2a3429;border:1px solid #736447;border-radius:11px;color:var(--gold);font-size:27px}
.game{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:700}
h1{font-size:22px;line-height:1.24}
main{margin:auto;padding:0 clamp(16px,3vw,45px);max-width:1900px}
#tabs{display:flex;align-items:center;gap:8px;padding:18px 0 12px;overflow:auto}
#tabs button{font-size:15px;min-height:40px;font-weight:650;padding-inline:15px}
#tabs [aria-current=true]{background:#393326;border-color:#a88959;color:#f4d4a4}
.overview{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);padding:14px 16px;border:1px solid var(--line);border-radius:10px 10px 0 0}
.profile h2{font-size:21px;overflow-wrap:anywhere}
#byline,small,.muted{color:var(--muted)}
#byline{font-size:13px;overflow-wrap:anywhere}
.separator{width:1px;height:26px;background:var(--line);margin-inline:3px}
#summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#19201c;padding:10px 16px;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px}
.summary-entry{display:flex;gap:8px;align-items:baseline;padding:3px 7px;border:1px solid #38463c;border-radius:5px;background:#232d26}
.summary-entry b{font-size:12px}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap}
.ratio{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.section-head h2{font-size:17px}
.workspace,.history{margin-top:16px}
#board{display:flex;align-items:stretch;gap:11px;overflow-x:auto;min-height:260px;padding:2px 1px 12px;scrollbar-color:#617162 #202820}
.lane{width:235px;flex:0 0 235px;min-width:0;background:#1a211d;border:1px solid var(--line);border-radius:9px;min-height:260px}
.lane.drag,.drop.drag{outline:2px solid var(--gold);outline-offset:-3px}
.lane-head{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px;background:#232d26;border-radius:9px 9px 0 0}
.lane-head h3{font-size:15px;color:var(--gold)}
.lane-head button{padding:0 8px;font-size:19px;line-height:27px}
.lane-cards{display:grid;gap:8px;align-content:start;padding:8px}
.empty{padding:9px;color:var(--muted);font-size:12px}
.spell{min-width:0;border:1px solid #3a493f;border-radius:7px;background:#262f28;overflow:hidden}
.spell.spent{background:#252824;border-color:#454945;color:#bcbdb5}
.spell.spent .art img{filter:grayscale(1);opacity:.62}
.spell-body{display:grid;gap:5px;padding:8px}
.spell-title{display:flex;align-items:start;justify-content:space-between;gap:5px}
.spell-title strong,.spell p{overflow-wrap:anywhere;white-space:pre-wrap;word-break:break-word}
.spell p{font-size:13px;max-height:145px;overflow:auto;color:var(--muted)}
.tiny{font-size:12px;padding:3px 7px}
.spell-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--green);font-size:12px}
.spell-end{display:grid;gap:5px;margin-top:3px}
.cast-row{display:flex;gap:5px;align-items:stretch}
.cast-row select{flex:1;min-width:0;font-size:12px;padding:4px;max-width:100%}
.cast{width:100%;font-size:13px;padding:4px 8px;color:#fae2bc;border-color:#62553e}
.cast-row .cast{width:auto}
.art{border:0;padding:0;border-radius:0;display:block;width:100%;background:#171c19}
.art img{display:block;width:100%;height:168px;object-fit:contain}
#log{display:block;width:100%;height:140px;resize:vertical;font-family:"Cascadia Mono","Microsoft JhengHei",monospace;font-size:13px;line-height:1.65}
footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;padding:9px 0 16px}
dialog{width:min(680px,calc(100% - 28px));max-height:calc(100% - 28px);padding:0;color:var(--ink);background:var(--panel);border:1px solid #6e654f;border-radius:13px;box-shadow:0 20px 60px #0009}
dialog::backdrop{background:#080c09bc}
.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding:12px 16px;background:#252f27;position:sticky;top:0;z-index:1}
.dialog-top h2{font-size:18px;overflow-wrap:anywhere}
#dialogBody{padding:15px 16px}
.form{display:grid;gap:13px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(174px,1fr));gap:9px}
.form label.field{display:grid;gap:4px;align-content:start}
.form label.check{display:flex;align-items:flex-start;gap:3px;font-size:14px}
.form legend{padding:0 5px;color:var(--gold);font-weight:650}
.form fieldset{border:1px solid var(--line);border-radius:7px;margin:0;padding:8px 10px;min-width:0}
.form fieldset .check+.check{margin-top:5px}
.form textarea{width:100%;min-height:85px;resize:vertical}
.form-buttons{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.push{margin-right:auto}
.job{display:grid;grid-template-columns:minmax(120px,1fr) minmax(92px,112px) auto;gap:8px;align-items:end;margin-bottom:8px;padding:5px 0 10px;border-bottom:1px solid var(--line)}
.job-sub,.job-extra{grid-column:1/-1}
.job > label select,.job > label input{width:100%}
.job-extra:empty{display:none}
.job-remove{margin-bottom:5px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}
th,td{padding:4px;border-bottom:1px solid var(--line)}
td input{width:100%;max-width:96px}
.drop{display:grid;gap:6px;padding:8px;border:1px dashed #748072;border-radius:7px;min-width:0}
.drop input{width:100%;font-size:12px;padding:4px}
.drop img{width:100%;height:90px;object-fit:contain;background:#151a17;border-radius:4px}
.drop .actions{justify-content:space-between}
.form-error{color:var(--danger);min-height:1.5em}
#viewer{width:min(880px,calc(100% - 20px))}
#viewBody{padding:10px;text-align:center}
#viewImage{display:block;margin:auto;max-width:100%;max-height:calc(100dvh - 105px);object-fit:contain}
#toast{position:fixed;z-index:9;right:16px;bottom:16px;background:#2c3730;border:1px solid #84714b;box-shadow:0 8px 24px #0008;max-width:min(440px,calc(100% - 32px));padding:9px 13px;border-radius:8px}
@media(max-width:630px){.job{grid-template-columns:minmax(100px,1fr) 85px auto}.separator{display:none}.overview{padding:10px}#summary{padding:8px}.lane{width:207px;flex-basis:207px}}
.origin-legend{display:flex;align-items:center;gap:7px;margin:0 0 8px;flex-wrap:wrap}
.origin-legend span,.source-label{border:1px solid var(--source-color,#718878);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--ink)}
.origin-primary{--source-color:#82b5da}
.origin-secondary{--source-color:#c295d2}
.origin-innate{--source-color:#d3ab58}
.spell.origin-primary,.spell.origin-secondary,.spell.origin-innate{border-color:var(--source-color);border-left-width:3px}
.spell.spent strong,.spell.spent .spell-meta,.spell.spent .stars{color:#a6aaa4}
.spell.spent .source-label{color:#b9bcb4}
#turnBar{margin-top:9px;padding:7px 11px;background:#202a24;border:1px solid var(--line);border-radius:8px}
#turnBar strong{color:var(--gold)}
#turnRuleState{color:var(--muted);font-size:13px}
#nextTurn{margin-left:auto}
.rule-note,.turn-block{display:block;margin-top:5px}
.turn-block{color:#e9c489}

.language{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.language select{color:var(--ink);padding:5px 7px}
html[lang="ja"]{font-family:"Yu Gothic UI",Meiryo,sans-serif}
html[lang="ko"]{font-family:"Malgun Gothic",sans-serif}
html[lang="zh-Hans"]{font-family:"Microsoft YaHei UI","Noto Sans SC",sans-serif}
@media(max-width:480px){.job{grid-template-columns:minmax(0,1fr) minmax(88px,1fr)}.job-remove{justify-self:start}}
</style>
</head>
<body>
<header class="top">
  <div class="identity"><span class="emblem" aria-hidden="true">✦</span><div><div class="game">DUNGEONS &amp; DRAGONS</div><h1 data-i18n>法術整備輔助</h1></div></div>
  <div class="actions" aria-label="檔案">
    <label class="language"><span id="languageLabel" data-i18n>語言</span><select id="language">
      <option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option>
      <option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option>
    </select></label>
    <button id="open" data-i18n>開啟存檔</button><button id="saveAs" data-i18n>另存新檔</button><button class="primary" id="save" data-i18n>存檔</button>
    <input type="file" id="openFallback" accept=".dndprep,.json" hidden>
  </div>
</header>
<main>
  <nav id="tabs" aria-label="角色"></nav>
  <section class="overview" aria-label="目前角色">
    <div class="profile"><h2 id="name"></h2><div id="byline"></div></div>
    <div class="actions">
      <button id="character" data-i18n>編輯角色</button><button id="rules" data-i18n>規則</button><button id="counts" data-i18n>調整法術位／次數</button>
      <span class="separator"></span><button id="short" data-i18n>短休</button><button id="long" data-i18n>長休</button><button id="cunning" hidden data-i18n>魔法巧計</button>
    </div>
  </section>
  <section id="summary" aria-label="法術位總表"></section>
  <div id="turnBar" class="actions" hidden aria-label="回合施法限制">
    <strong id="turnState" aria-live="polite"></strong><span id="turnRuleState"></span><button id="nextTurn" data-i18n>下一回合</button>
  </div>
  <section class="workspace" aria-label="法術整備">
    <div class="section-head"><h2 data-i18n>整備欄</h2><div class="actions"><button id="scrollLeft" aria-label="向左捲動">←</button><button id="scrollRight" aria-label="向右捲動">→</button><button id="addSpell" class="primary" data-i18n>＋ 新增法術</button></div></div>
    <div id="legend" class="origin-legend"></div>
    <div id="board" tabindex="0" aria-label="法術環位與卡片"></div>
  </section>
  <section class="history" aria-label="戰鬥紀錄">
    <div class="section-head"><h2 data-i18n>戰鬥紀錄</h2><div class="actions"><button id="logNote" data-i18n>新增備註</button><button id="undo" data-i18n>復原上一筆操作</button><button id="copy" data-i18n>複製全文</button><button id="exportTxt" data-i18n>匯出 TXT</button><button id="resetLog" class="danger" data-i18n>重置紀錄</button></div></div>
    <textarea id="log" aria-label="戰鬥施法使用歷程" placeholder="施法、休息和次數調整會依時間記錄於此。雙擊可全選。" readonly></textarea>
  </section>
  <footer><span id="fileState"></span><span data-i18n>雙擊戰鬥紀錄可全選 · Ctrl+S 存檔</span></footer>
</main>
<dialog id="editor"><div class="dialog-shell"><div class="dialog-top"><h2 id="dialogTitle"></h2><button id="closeEditor" aria-label="關閉">✕</button></div><div id="dialogBody"></div></div></dialog>
<dialog id="viewer"><div class="dialog-shell"><div class="dialog-top"><h2 id="viewTitle"></h2><div class="actions"><button id="backSide" data-i18n>反面</button><button id="closeViewer" aria-label="關閉圖片">✕</button></div></div><div id="viewBody"><img id="viewImage" alt="法術卡預覽"></div></div></dialog>

<script>'use strict';

const LANGUAGES = ['zh-Hant','zh-Hans','en','ja','ko'];
const LOCALE_KEY = 'dnd-spell-prep.language';

function browserLocale(language) {
 if(!language) return 'zh-Hant';
 if(/^zh(?:-|$)/i.test(language)) {
  return /(?:^|-)(Hans|CN|SG)(?:-|$)/i.test(language)?'zh-Hans':'zh-Hant';
 }
 if(/^ja(?:-|$)/i.test(language)) return 'ja';
 if(/^ko(?:-|$)/i.test(language)) return 'ko';
 return 'en';
}

function prefLocale() {
 try {
  const saved=globalThis.localStorage?.getItem(LOCALE_KEY);
  if(LANGUAGES.includes(saved)) return saved;
 } catch {}
 return browserLocale(globalThis.navigator?.language);
}

let locale=prefLocale();

function setLocale(language) {
 if(!LANGUAGES.includes(language)) return;
 locale=language;
 try {globalThis.localStorage?.setItem(LOCALE_KEY,locale);} catch {}
}

function t(key,...values) {
 const message=(locale!=='zh-Hant'&&Object.prototype.hasOwnProperty.call(MESSAGES,key)?MESSAGES[key][LANGUAGES.indexOf(locale)-1]:key)??'';
 return values.length?message.replace(/\{(\d+)\}/g,(match,index)=>values[index]??match):message;
}

const staticLabels=[];
function localizePage() {
 if(!staticLabels.length) {
  for(const el of document.querySelectorAll('[data-i18n]')) {
   staticLabels.push([el,'textContent',el.textContent]);
  }
  // Freeze only the initial markup. Dynamically rendered labels use t() directly.
  for(const name of ['aria-label','alt','placeholder']) {
   for(const el of document.querySelectorAll('['+name+']')) {
    const key=el.getAttribute(name);
    staticLabels.push([el,name,key]);
   }
  }
 }
 document.documentElement.lang=locale;
 for(const [el,property,key] of staticLabels) {
  if(property==='textContent') el.textContent=t(key);
  else el.setAttribute(property,t(key));
 }
}
</script>

function allowDrop(el,handle) {
 el.ondragover=e=>{
  if(!Array.from(e.dataTransfer.types).includes('Files')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect='copy';
  el.classList.add('drag');
 };
 el.ondragleave=e=>{
  if(!el.contains(e.relatedTarget)) el.classList.remove('drag');
 };
 el.ondrop=e=>{
  if(!e.dataTransfer.files.length) return;
  e.preventDefault();
  e.stopPropagation();
  el.classList.remove('drag');
  handle([...e.dataTransfer.files]);
 };
}
function readImage(file) {
 const types={png:'png',jpg:'jpeg',jpeg:'jpeg',webp:'webp',gif:'gif'};
 const kind=types[file.name.split('.').pop().toLowerCase()];
 if(!kind||file.size>16*1024*1024) return Promise.reject(new Error(t('請選擇 16 MB 以內的 PNG、JPG、WebP 或 GIF 圖片。')));
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error(t('圖片讀取失敗。')));
  reader.onload=()=>{
   const value='data:image/'+kind+';base64,'+reader.result.split(',')[1];
   const sample=new Image();
   sample.onload=()=>resolve(value);
   sample.onerror=()=>reject(new Error(t('圖片無法顯示，請確認檔案格式。')));
   sample.src=value;
  };
  reader.readAsDataURL(file);
 });
}

  if(long&&c.rules.longSlots) c.used=arr9(0);
  if(c.rules[long?'pactLong':'pactShort']) c.pactUsed=0;
  const current=new Map(allSpells(c).map(s=>[s.id,s.mode]));
  for(const key of Object.keys(c.spellUsed)) {
   const mode=current.get(key)||(key.startsWith('signature:')?'short':
    /^(innate:|arcanum:|hunter$|land-circle$)/.test(key)?'long':'manual');
   if(/short/i.test(mode)||(long&&/long/i.test(mode))) c.spellUsed[key]=0;
  }
  if(long) {
   const todayUsed=c.features.arc14&&!day?.checked;
   c.features=todayUsed?{arc14:true}:{};
  } else {
   c.used=c.used.map((value,i)=>value-restore[i]);
   for(const key of paid) c.features[key]=true;
  }
  c.turn=emptyTurn(c.turn.number);
  update(c,(long?t('長休'):t('短休'))+(extra.length?'（'+extra.join('；')+'）':''));
 });
}
function cunning() {
 const c=cNow(), p=pools(c);
 if(!c.rules.cunning24||p.war<2||c.features.cunning) return;
 const count=Math.min(c.pactUsed,Math.ceil(p.pact.max/2));
 if(!count) return;
 undoPoint(c);
 c.pactUsed-=count;
 c.features.cunning=true;
 update(c,t('使用魔法巧計，恢復 {0} 格契約法術位',count));
}
function note() {
 const c=cNow();
 let content;
 dialog(t('新增戰鬥備註'),t('加入紀錄'),form=>{
  content=element('textarea');
  content.required=true;
  content.maxLength=4000;
  form.append(field(t('備註內容'),content));
 },()=>{
  if(!content.value.trim()) return t('請輸入備註。');
  update(c,t('備註 · {0}',content.value.trim()));
 });
}
function unpack(raw) {
 const obj=v=>v&&typeof v==='object'&&!Array.isArray(v);
 const strict=(v,msg)=>{if(!v) throw new Error(msg);};
 strict(obj(raw)&&raw.version===1&&Array.isArray(raw.characters)&&raw.characters.length,t('這不是可辨識的法術整備存檔。'));
 const characterIds=new Set();
 const characters=raw.characters.map((item,index)=>{
  const msg=t('角色 {0} 的資料不完整。',index+1);
  strict(obj(item)&&Array.isArray(item.jobs)&&item.jobs.length&&Array.isArray(item.spells)&&Array.isArray(item.log),msg);
  const c=newCharacter();
  if(/^[A-Za-z0-9-]{1,80}$/.test(item.id)&&!characterIds.has(item.id)) c.id=item.id;
  characterIds.add(c.id);
  c.name=str(item.name,80);
  c.species=own(SPECIES,item.species)?item.species:'human';
  c.speciesName=str(item.speciesName,50);
  c.jobs=item.jobs.map(row=>{
   strict(obj(row)&&own(CLASSES,row.job)&&Number.isInteger(row.level)&&row.level>0&&row.level<=20,msg);
   return {job:row.job,level:row.level,sub:!!row.sub&&own(SUBS,row.job),name:str(row.name,50),specialty:str(row.specialty,50)};
  });
  strict(c.jobs.reduce((n,r)=>n+r.level,0)<=20,msg);
  strict(new Set(c.jobs.map(r=>r.job==='custom'?r.job+':'+r.name.toLowerCase():r.job)).size===c.jobs.length,msg);
  const r=obj(item.rules)?item.rules:{};
  for(const key of Object.keys(c.rules)) if(typeof r[key]==='boolean') c.rules[key]=r[key];
  for(const [old,next] of PAIRS) if(c.rules[old]&&c.rules[next]) c.rules[old]=false;
  c.override=c.override.map((_,i)=>item.override?.[i]==null?null:num(item.override[i]));
  c.used=c.used.map((_,i)=>num(item.used?.[i],999));
  c.pactRing=item.pactRing==null?null:Math.max(1,num(item.pactRing,9));
  c.pactMax=item.pactMax==null?null:num(item.pactMax);
  c.pactUsed=num(item.pactUsed,999);
  if(pools(c).pact.max&&!pools(c).pact.ring) c.pactRing=1;
  for(const key of ['arc14','arc24','land','cunning']) c.features[key]=!!item.features?.[key];
  const keys=new Set();
  const validKey=key=>/^[A-Za-z0-9:-]{1,90}$/.test(key)&&!['constructor','prototype','toString','valueOf'].includes(key);
  const presetKey=key=>/^(innate:(?:14|24):[a-z]+:\d|arcanum:[0-3]|signature:[01]|hunter|land-circle)$/.test(key);
  const text=s=>({name:str(s.name,110),notes:str(s.notes,10000),front:img(s.front),back:img(s.back),
   ...(own(CAST_TIMES,s.castTime)?{castTime:s.castTime}:{})});
  c.spells=item.spells.map(s=>{
   strict(obj(s)&&validKey(s.id)&&!presetKey(s.id)&&!keys.has(s.id)&&own(TYPES,s.mode),msg);
   keys.add(s.id);
   const origin=own(SOURCES,s.origin)?s.origin:s.area==='innate'?'innate':'other';
   const ring=num(s.ring,9);
   return {id:s.id,...text(s),ring,mode:!ring&&needsSlot(s)?'free':s.mode,
    count:Math.max(1,num(s.count)),also:ring>0&&!!s.also,area:origin==='innate'?'innate':'',origin};
  });
  if(obj(item.presets)) for(const [key,s] of Object.entries(item.presets)) {
   if(!presetKey(key)||!obj(s)) continue;
   const preset=text(s);
   if(!preset.name) delete preset.name;
   c.presets[key]=preset;
  }
  if(obj(item.spellUsed)) for(const [key,v] of Object.entries(item.spellUsed)) {
   if(keys.has(key)||presetKey(key)) c.spellUsed[key]=num(v,999);
  }
  if(obj(item.turn)) {
   c.turn=emptyTurn(num(item.turn.number,Number.MAX_SAFE_INTEGER)||1);
   for(const key of ['slot','bonus','other','reaction']) c.turn[key]=item.turn[key]===true;
  }
  c.log=item.log.filter(line=>typeof line==='string'&&!/^\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\] 更新角色設定（(?:保留|重設)已用次數）$/.test(line));
  return c;
 });
 return {version:1,active:characters.some(c=>c.id===raw.active)?raw.active:characters[0].id,characters};
}
const fileType = () => ({description:t('D&D 法術整備存檔'),accept:{'application/json':['.dndprep','.json']}});
const saveTitle = ()=>(cNow().name||t('法術整備')).replace(/[<>:"/\\|?*\u0000-\u001F]/g,'_');
function download(text,name,type) {
 const url=URL.createObjectURL(new Blob([text],{type}));
 const a=element('a');
 a.href=url;
 a.download=name;
 document.body.append(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}
function markSaved() {
 dirty=false;
 renderFile();
}
function projectText() {
 const data=JSON.stringify(project);
 if(new Blob([data]).size>200*1024*1024) throw new Error(t('存檔超過 200 MB，請縮小法術卡圖片。'));
 return data;
}
async function save(as=false) {
 if(fileBusy) return;
 fileBusy=true;
 try {
  if(window.showSaveFilePicker) {
   try {
    let destination=fileHandle;
    if(as||!destination) {
     destination=await window.showSaveFilePicker({suggestedName:saveTitle()+'.dndprep',types:[fileType()]});
    }
    const version=revision;
    const contents=projectText();
    const writable=await destination.createWritable();
    try {
     await writable.write(contents);
     await writable.close();
    } catch(error) {
     await writable.abort().catch(()=>{});
     throw error;
    }
    fileHandle=destination;
    fileName=destination.name;
    if(version===revision) markSaved();
    else renderFile();
    toast(t('已存檔｜{0}',fileName));
    return;
   } catch(error) {
    if(error.name==='AbortError') return;
    if(!['SecurityError','NotAllowedError','NotSupportedError'].includes(error.name)) throw error;
   }
  }
  fileName=saveTitle()+'.dndprep';
  download(projectText(),fileName,'application/json');
  markSaved();
  toast('已交給瀏覽器下載存檔。');
 } catch(error) {toast(t('存檔失敗｜{0}',error.message));}
 finally {fileBusy=false;}
}
async function load(file,handle=null) {
 if(!file) return;
 try {
  if(file.size>200*1024*1024) throw new Error(t('存檔超過 200 MB。'));
  const loaded=unpack(JSON.parse(await file.text()));
  project=loaded;
  fileName=file.name;
  fileHandle=handle;
  undo.clear();
  markSaved();
  render();
  $('board').scrollLeft=0;
  toast(t('已開啟｜{0}',fileName));
 } catch(error) {
  toast(error instanceof SyntaxError?t('存檔格式無法讀取。'):t('開啟失敗｜{0}',error.message));
 }
}
async function openFile() {
 if(fileBusy||dirty&&!confirm(t('目前有未存變更。仍要開啟另一份存檔？'))) return;
 if(window.showOpenFilePicker) {
  fileBusy=true;
  try {
   const [handle]=await window.showOpenFilePicker({types:[fileType()],multiple:false});
   await load(await handle.getFile(),handle);
   return;
  } catch(error) {
   if(error.name==='AbortError') return;
   if(!['SecurityError','NotAllowedError','NotSupportedError'].includes(error.name)) {
    toast(t('開啟失敗｜{0}',error.message));
    return;
   }
  } finally {fileBusy=false;}
 }
 $('openFallback').click();
}
$('openFallback').onchange=async e=>{
 const chooser=e.target;
 if(fileBusy) return;
 fileBusy=true;
 try {await load(chooser.files[0]);}
 finally {fileBusy=false;chooser.value='';}
};
async function copyLog() {
 const box=$('log');
 box.focus();
 box.select();
 try {
  if(!document.execCommand('copy')) await navigator.clipboard.writeText(box.value);
  toast('已複製戰鬥紀錄');
 } catch {toast('已全選，可按 Ctrl+C 複製。');}
}
$('open').onclick=openFile;
$('save').onclick=()=>save();
$('saveAs').onclick=()=>save(true);
$('character').onclick=()=>character();
$('rules').onclick=rules;
$('counts').onclick=counts;
$('addSpell').onclick=()=>spellEditor(null,1);
$('short').onclick=()=>recover(false);
$('long').onclick=()=>recover(true);
$('cunning').onclick=cunning;
$('undo').onclick=()=>{
 const c=cNow(),previous=undo.get(c.id);
 if(!previous) return;
 const {last,turn,...state}=previous;
 Object.assign(c,state);
 if(c.turn.number===turn.number) c.turn=turn;
 undo.delete(c.id);
 const original=c.log[last]?.replace(/^\[[^\]]+\] /,'')||t('上一筆操作');
 update(c,t('復原 · {0}',original));
};
$('nextTurn').onclick=()=>{
 const c=cNow();
 if(!tracksTurns(c.rules)) return;
 c.turn=emptyTurn(c.turn.number+1);
 mark();
 render();
};
$('logNote').onclick=note;
$('resetLog').onclick=()=>{
 const c=cNow();
 if(!c.log.length) return;
 dialog(t('重置戰鬥紀錄'),t('確認重置'),form=>{
  form.append(element('p','',t('重置後，「{0}」的 {1} 筆戰鬥紀錄將歸零，無法復原。法術位與使用次數會保留。',title(c),c.log.length)));
 },()=>{
  c.log=[];
  undo.delete(c.id);
  mark();
  render();
  toast('已重置戰鬥紀錄');
 },true);
};
$('copy').onclick=copyLog;
$('log').ondblclick=e=>e.currentTarget.select();
$('exportTxt').onclick=()=>download('\uFEFF'+$('log').value.replace(/\r?\n/g,'\r\n'),saveTitle()+'_'+t('戰鬥紀錄')+'.txt','text/plain;charset=utf-8');
$('closeEditor').onclick=()=>editor.close();
$('closeViewer').onclick=()=>viewer.close();
$('scrollLeft').onclick=()=>$('board').scrollBy({left:-246,behavior:'smooth'});
$('scrollRight').onclick=()=>$('board').scrollBy({left:246,behavior:'smooth'});
viewer.onclick=e=>{if(e.target===viewer) viewer.close();};
$('language').value=locale;
$('language').onchange=()=>{
 setLocale($('language').value);
 localizePage();
 render();
};
localizePage();
window.addEventListener('keydown',e=>{
 if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();if(!editor.open) save(e.shiftKey);}
 if(e.ctrlKey&&e.key.toLowerCase()==='o'){e.preventDefault();if(!editor.open) openFile();}
});
window.addEventListener('beforeunload',e=>{
 if(dirty){e.preventDefault();e.returnValue='';}
});
window.addEventListener('dragover',e=>{
 if(Array.from(e.dataTransfer.types).includes('Files')) e.preventDefault();
});
window.addEventListener('drop',e=>{
 if(e.dataTransfer.files.length) e.preventDefault();
});
render();
</script>
